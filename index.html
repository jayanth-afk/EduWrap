<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="EduWrap — All-in-One AI-Powered Collaborative Study Workspace. Notes, Chat, Flashcards, Quizzes, and Video collaboration in one unified platform." />
    <title>EduWrap — Collaborative Study Workspace</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Sora:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>

    <!-- Facebook SDK for JavaScript -->
    <script>
      function checkLoginState() {
        if (window.FB && typeof window.FB.getLoginStatus === 'function') {
          FB.getLoginStatus(function(response) {
            if (typeof window.statusChangeCallback === 'function') {
              window.statusChangeCallback(response);
            }
          });
        }
      }

      window.fbAsyncInit = function() {
        FB.init({
          appId      : '{your-app-id}',
          cookie     : true,
          xfbml      : true,
          version    : 'v20.0'
        });
          
        FB.AppEvents.logPageView();   

        // Check login status on page load
        checkLoginState();
      };

      (function(d, s, id){
         var js, fjs = d.getElementsByTagName(s)[0];
         if (d.getElementById(id)) {return;}
         js = d.createElement(s); js.id = id;
         js.src = "https://connect.facebook.net/en_US/sdk.js";
         fjs.parentNode.insertBefore(js, fjs);
       }(document, 'script', 'facebook-jssdk'));
    </script>

    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
